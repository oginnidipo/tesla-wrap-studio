name: Tesla Car Wrap
options:
  bundleIdPrefix: com.dipops
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Tesla Car Wrap:
    type: application
    platform: iOS
    sources: [WrapStudio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dipops.teslacarwrap
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "11"
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: "Tesla Car Wrap"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_CFBundleDisplayName: "Tesla Car Wrap"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save your wrap as a PNG in Photos so you can upload it from the Tesla app."
  WrapStudioTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [WrapStudioTests]
    dependencies:
      - target: Tesla Car Wrap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  WrapStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [WrapStudioUITests]
    dependencies:
      - target: Tesla Car Wrap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tesla Car Wrap:
    build:
      targets:
        Tesla Car Wrap: all
    test:
      targets:
        - WrapStudioTests
        - WrapStudioUITests

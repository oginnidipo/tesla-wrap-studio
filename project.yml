name: Tesla Car Wrap
options:
  bundleIdPrefix: com.dipops
  deploymentTarget:
    iOS: "16.0"
targets:
  Tesla Car Wrap:
    type: application
    platform: iOS
    sources: [WrapStudio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dipops.teslacarwrap
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "7"
        DEVELOPMENT_TEAM: 8UR98GGM8L
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: "Tesla Car Wrap"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "Tesla Car Wrap"
